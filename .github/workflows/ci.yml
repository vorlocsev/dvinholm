name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify .NET SDK
        run: dotnet --version

      - name: Restore
        run: dotnet restore Dvinholm.sln

      - name: Build
        run: dotnet build Dvinholm.sln --configuration Release --no-restore -p:Platform=x86

      # Unit tests do not need the x86 J2534 deployment target. Build and run
      # the test host as x64 so its architecture matches the installed .NET host.
      - name: Test
        run: dotnet test tests/VolvoJ2534.App.Tests/VolvoJ2534.App.Tests.csproj --configuration Release -p:Platform=x64 --logger "trx;LogFileName=test-results.trx"

      - name: Publish
        run: dotnet publish src/VolvoJ2534.App/VolvoJ2534.App.csproj --configuration Release --no-restore --self-contained true --runtime win-x86 -p:Platform=x86 --output artifacts/app

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Dvinholm-Windows-x86
          path: artifacts/app
