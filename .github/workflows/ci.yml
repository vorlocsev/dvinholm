name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify .NET SDK
        run: dotnet --version

      - name: Restore
        run: dotnet restore Dvinholm.sln

      - name: Build
        run: dotnet build Dvinholm.sln --configuration Release --no-restore -p:Platform=x86

      # The app and its referenced assembly are x86. Install the matching x86
      # .NET SDK so tests run with an x86 test host instead of mixing architectures.
      - name: Setup .NET x86 test host
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
          architecture: x86

      - name: Test
        run: dotnet test tests/Dvinholm.App.Tests/Dvinholm.App.Tests.csproj --configuration Release -p:Platform=x86 --logger "trx;LogFileName=test-results.trx"

      - name: Setup .NET x64 for publish
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          architecture: x64

      - name: Publish
        run: dotnet publish src/Dvinholm.App/Dvinholm.App.csproj --configuration Release --no-restore --self-contained true --runtime win-x86 -p:Platform=x86 --output artifacts/app

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Dvinholm-Windows-x86
          path: artifacts/app
