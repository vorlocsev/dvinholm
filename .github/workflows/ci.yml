name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "AI_WORKLOG.md"
  pull_request:
  workflow_dispatch:

# Cancel superseded PR runs; never cancel a publish-to-main build.
concurrency:
  group: dvinholm-lite-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify .NET SDK
        run: dotnet --version

      # Fail fast if a Windows PowerShell 5.1 packaging or Lite script has a
      # parse error. A malformed preflight must never be masked by negative tests.
      - name: Parse Windows PowerShell 5.1 distribution scripts
        shell: powershell
        run: |
          foreach ($path in @('eng/Test-WindowsDistribution.ps1', 'eng/Test-WindowsDistributionExtraction.ps1', 'eng/Test-LitePrerequisites.ps1', 'eng/Manage-Lite-Dependencies.ps1', 'eng/Updater-Banner.ps1', 'eng/Launcher-AuroraTheme.ps1', 'eng/Launcher-ServiceCockpit.ps1', 'eng/Launcher-ReleaseDiscovery.ps1', 'eng/Test-LauncherReleaseDiscovery.ps1', 'eng/Launcher-VerifiedDownload.ps1', 'eng/Test-LauncherVerifiedDownload.ps1', 'eng/Test-LauncherStorageCleanup.ps1', 'eng/Launcher-ApplyPrepared.ps1', 'eng/Test-LauncherApplyPrepared.ps1', 'eng/Launcher-RebootRecovery.ps1', 'eng/Test-LauncherRebootRecovery.ps1', 'eng/Inspect-LauncherRecovery.ps1', 'eng/Test-LauncherRecoveryInspection.ps1', 'eng/Test-LauncherRecoveryAudit.ps1', 'eng/Test-LauncherRecoveryAuditValidation.ps1', 'eng/Test-PackagedLauncherInspector.ps1', 'eng/Test-LauncherRecoveryProcesses.ps1', 'eng/Test-LauncherBackupFinalization.ps1', 'eng/J2534-DriverManager.ps1', 'eng/J2534-DriverUI.ps1', 'eng/Package-Updater-Banner.ps1', 'eng/Build-Launchers.ps1', 'eng/NativeIconResourcePath.ps1', 'eng/Test-NativeIconResourcePath.ps1', 'eng/Invoke-NativeLauncherBuild.ps1', 'eng/New-LauncherIcon.ps1', 'eng/Test-NativeLauncherIcons.ps1', 'eng/Test-NorthernLauncherIconFrames.ps1', 'eng/Assert-LauncherSelfUpdatePackage.ps1', 'eng/Test-LauncherSelfUpdatePackage.ps1', 'eng/Invoke-LauncherReplacement.ps1', 'eng/Test-LauncherReplacement.ps1', 'eng/Package-Launchable-Lite.ps1', 'eng/Test-Launchable-Lite.ps1', 'eng/Test-PackagedUpdaterBanner.ps1', 'eng/Test-LiteBundledPreflight.ps1', 'eng/Test-WindowsDistributionChecksums.ps1', 'eng/Test-PublishedDevelopmentRelease.ps1')) {
            $tokens = $null
            $syntaxErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $path).Path, [ref]$tokens, [ref]$syntaxErrors) | Out-Null
            if (@($syntaxErrors).Count -gt 0) {
              foreach ($syntaxError in $syntaxErrors) {
                Write-Host "::error file=$path,line=$($syntaxError.Extent.StartLineNumber)::$($syntaxError.Message)"
                Write-Host ("PowerShell parse detail: {0}:{1}:{2}: {3}; source={4}" -f $path, $syntaxError.Extent.StartLineNumber, $syntaxError.Extent.StartColumnNumber, $syntaxError.Message, $syntaxError.Extent.Text)
              }
              throw "PowerShell 5.1 syntax failed for $path"
            }
            Write-Host "PowerShell 5.1 syntax valid: $path"
          }

      # Exercise the real .NET 10 Desktop x86 installer metadata selector
      # with synthetic Microsoft release-index fixtures. No network,
      # download, installer launch, admin elevation or app runtime needed.
      # RC icon strings must not interpret Windows path separators as escapes.
      # All eight checks are synthetic, require no compiler and change no files.
      - name: Verify native RC icon paths (eight offline gates)
        shell: powershell
        run: ./eng/Test-NativeIconResourcePath.ps1

      - name: Verify Lite dependency manager offline installer metadata
        shell: powershell
        run: |
          ./eng/Manage-Lite-Dependencies.ps1 -Mode SelfTest

      - name: Check J2534 driver installer safety offline
        shell: powershell
        run: ./eng/J2534-DriverManager.ps1 -Mode SelfTest

      - name: Verify standalone Updater Banner offline safety
        shell: powershell
        run: |
          ./eng/Updater-Banner.ps1 -Mode SelfTest

      - name: Verify native Launcher version comparison offline
        shell: powershell
        run: ./eng/Test-LauncherReleaseDiscovery.ps1

      # Explicitly requested local cleanup never uses a live install.
      - name: Verify native Launcher storage cleanup (eight offline gates)
        shell: powershell
        run: ./eng/Test-LauncherStorageCleanup.ps1

      # Read-only Windows 11 acceptance classifier; all HKCU readings in
      # this test use a dedicated fake registry fixture, no machine changes.
      - name: Verify read-only native Launcher recovery acceptance states
        shell: powershell
        run: ./eng/Test-LauncherRecoveryInspection.ps1

      # Validate date ranges and permitted reason/outcome combinations
      # without touching any live Run entry or installed Launcher files.
      - name: Verify strict sign-in audit parsing (eight read-only gates)
        shell: powershell
        run: ./eng/Test-LauncherRecoveryAuditValidation.ps1

      # Use the actual inbox Windows PowerShell 5.1 and WinForms runtime.
      # Instantiates the GUI controls without ShowDialog, network or installers.
      - name: Verify standalone Updater Banner Windows WinForms UI
        shell: powershell
        run: |
          ./eng/Updater-Banner.ps1 -Mode UiSmokeTest

      # Actual Windows Forms offscreen rendering of the constructed home,
      # Updates view and EN locale. No ShowDialog, installer or network.
      # These are Windows-runner DPI captures, not verified 125/150% OS DPI.
      - name: Render actual Northern Aurora WinForms GUI previews
        shell: powershell
        run: ./eng/Updater-Banner.ps1 -Mode UiPreview -PreviewDirectory artifacts/aurora-gui-preview

      # PR-only images for user visual approval; no changed release payload.
      - name: Upload Northern Aurora GUI previews
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: Dvinholm-Launcher-Aurora-GUI-Preview
          path: artifacts/aurora-gui-preview/Launcher-Aurora-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Restore
        run: dotnet restore Dvinholm.sln

      - name: Build
        run: dotnet build Dvinholm.sln --configuration Release --no-restore -p:Platform=x86 -p:DvinholmDevelopmentFeatures=true

      # The app and its referenced assembly are x86. Install the matching x86
      # .NET SDK so tests run with an x86 test host instead of mixing architectures.
      - name: Setup .NET x86 test host
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
          architecture: x86

      # Only the retired RC/staging/MSIX source-fixture contracts are deferred
      # from PRs. CAN, ISO-TP, UDS, updater security, Lite ZIP checks and
      # the actual Stable feature smoke gates remain on EVERY PR.
      - name: Test active behavior (PR)
        if: github.event_name == 'pull_request'
        run: dotnet test tests/Dvinholm.App.Tests/Dvinholm.App.Tests.csproj --configuration Release --no-build --no-restore -p:Platform=x86 -p:DvinholmDevelopmentFeatures=true --filter "Category!=ArchivedWorkflow" --logger "trx;LogFileName=pr-active-tests.trx"

      # Run the complete suite on main, and on explicit manual CI dispatch.
      # This includes archived workflow compatibility tests for regression.
      - name: Test complete regression (main/manual)
        if: github.event_name != 'pull_request'
        run: dotnet test tests/Dvinholm.App.Tests/Dvinholm.App.Tests.csproj --configuration Release --no-build --no-restore -p:Platform=x86 -p:DvinholmDevelopmentFeatures=true --logger "trx;LogFileName=full-regression.trx"

      # The production assembly is compiled separately with all demo/test
      # feature flags OFF. No GUI or J2534 hardware is needed for these tests.
      - name: Test actual Stable feature profile (eight offline smoke gates)
        run: dotnet test tests/Dvinholm.Stable.Tests/Dvinholm.Stable.Tests.csproj --configuration Release -p:Platform=x86 -p:DvinholmDevelopmentFeatures=false --logger "trx;LogFileName=stable-profile-results.trx"

      - name: Setup .NET x64 for publish
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          architecture: x64

      # Lite x86 is the only automatic Development distribution.
      - name: Publish application x86
        run: dotnet publish src/Dvinholm.App/Dvinholm.App.csproj --configuration Release --no-restore --self-contained false --runtime win-x86 -p:Platform=x86 -p:WindowsAppSDKSelfContained=false -p:PublishTrimmed=false -p:PublishAot=false -p:DvinholmDevelopmentFeatures=true -p:DebugType=none -p:DebugSymbols=false -p:Version=0.2.4 -p:InformationalVersion=0.2.4+${{ github.sha }}.ci${{ github.run_number }} --output artifacts/app-lite

      - name: Verify branded Windows icon is published
        shell: pwsh
        run: |
          $iconPath = 'artifacts/app-lite/Assets/Dvinholm.ico'
          if (-not (Test-Path -LiteralPath $iconPath -PathType Leaf)) {
            throw "The published Dvinholm app icon is missing: $iconPath"
          }
          if (-not (Test-Path -LiteralPath 'artifacts/app-lite/Dvinholm.App.exe' -PathType Leaf)) {
            throw 'The published Dvinholm executable is missing.'
          }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $iconPath).Path)
          if ($bytes.Length -lt 6) { throw 'Published ICO file is truncated.' }
          $reserved = [System.BitConverter]::ToUInt16($bytes, 0)
          $kind = [System.BitConverter]::ToUInt16($bytes, 2)
          $count = [System.BitConverter]::ToUInt16($bytes, 4)
          if ($reserved -ne 0 -or $kind -ne 1 -or $count -lt 7) {
            throw "Published ICO header is invalid (type $kind, images $count)."
          }
          Write-Host "Verified $count embedded icon sizes and packaged Dvinholm.App.exe."

      # Use the already installed Visual Studio toolchain directly. The
      # external ilammy/msvc-dev-cmd@v1 action still targets deprecated Node 20.
      # VsDevCmd and native compilation share one process-scoped environment;
      # no compiler state is needed by subsequent package validation steps.
      - name: Configure MSVC and build native x86 launchers (Node-free)
        shell: pwsh
        run: ./eng/Invoke-NativeLauncherBuild.ps1 -OutputDirectory artifacts/native

      - name: Verify distinct embedded native EXE icons
        shell: powershell
        run: ./eng/Test-NativeLauncherIcons.ps1 -Directory artifacts/native

      # Extract actual PNG payloads from the generated native Launcher ICO,
      # not mock images. Check all seven frames and legibility at 16/32/256.
      - name: Verify Northern Launcher icon frames (eight offline gates)
        shell: powershell
        run: ./eng/Test-NorthernLauncherIconFrames.ps1 -IconPath artifacts/native/Dvinholm-Launcher.ico -PreviewDirectory artifacts/launcher-icon-preview

      # Human visual approval is still necessary. This PR-only artifact makes
      # the actual built 16/32/256 PNGs inspectable without publishing a release.
      - name: Upload Northern Launcher icon previews
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: Dvinholm-Launcher-Icon-Preview
          path: artifacts/launcher-icon-preview/Launcher-*.png
          if-no-files-found: error
          retention-days: 14

      - name: Package and validate main application
        shell: pwsh
        run: |
          ./eng/Package-WindowsDistribution.ps1 -Flavor Lite -PublishDirectory artifacts/app-lite -ZipPath artifacts/Dvinholm-Windows-x86-Lite.zip
          ./eng/Test-WindowsDistribution.ps1 -Flavor Lite -ZipPath artifacts/Dvinholm-Windows-x86-Lite.zip
          ./eng/Test-WindowsDistributionExtraction.ps1 -Flavor Lite -ZipPath artifacts/Dvinholm-Windows-x86-Lite.zip -SimulatedLiteHost
          ./eng/Test-LiteBundledPreflight.ps1 -Flavor Lite -ZipPath artifacts/Dvinholm-Windows-x86-Lite.zip
          ./eng/Package-Updater-Banner.ps1 -ZipPath artifacts/Dvinholm-Updater-Banner-Windows-x86.zip -NativeDirectory artifacts/native -BuildTag "ci-${{ github.run_number }}"
          ./eng/Package-Launchable-Lite.ps1 -LiteZip artifacts/Dvinholm-Windows-x86-Lite.zip -UpdaterZip artifacts/Dvinholm-Updater-Banner-Windows-x86.zip -NativeDirectory artifacts/native -ZipPath artifacts/Dvinholm-Windows-x86.zip
          ./eng/Test-Launchable-Lite.ps1 -ZipPath artifacts/Dvinholm-Windows-x86.zip
          ./eng/Test-WindowsDistributionChecksums.ps1 -Directory artifacts -LiteOnly -WithUpdaterBanner -WithLauncherBundle -Generate
          ./eng/Test-WindowsDistributionChecksums.ps1 -Directory artifacts -LiteOnly -WithUpdaterBanner -WithLauncherBundle
          $lite = (Get-Item -LiteralPath artifacts/Dvinholm-Windows-x86-Lite.zip).Length
          "Lite ZIP: $([math]::Round($lite / 1MB, 2)) MiB. Runtime prerequisites required; trimming disabled." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # Eight offline tests against the real standalone ZIP, using only inbox
      # Windows PowerShell 5.1. Never replaces a live Launcher.exe.
      - name: Verify standalone launcher self-update staging safety
        shell: powershell
        run: ./eng/Test-LauncherSelfUpdatePackage.ps1 -ZipPath artifacts/Dvinholm-Updater-Banner-Windows-x86.zip

      # Offline release asset checks against the final ZIP and checksum
      # manifest. Simulated trusted metadata; no network or installation.
      - name: Verify native Launcher download and staging integrity
        shell: powershell
        run: ./eng/Test-LauncherVerifiedDownload.ps1 -ZipPath artifacts/Dvinholm-Updater-Banner-Windows-x86.zip -SumsPath artifacts/SHA256SUMS.txt -ExpectedTag "ci-${{ github.run_number }}"

      # Detached worker uses the real Windows native ZIP and manifest in
      # temporary installations only; no network, ECU or GUI process launch.
      - name: Verify native Launcher apply/rollback handoff offline
        shell: powershell
        run: ./eng/Test-LauncherApplyPrepared.ps1 -ZipPath artifacts/Dvinholm-Updater-Banner-Windows-x86.zip -SumsPath artifacts/SHA256SUMS.txt -ExpectedTag "ci-${{ github.run_number }}"

      # Windows sign-in recovery is simulated with file-backed HKCU Run fixtures;
      # production registry and user startup settings are never modified in CI.
      - name: Verify native Launcher next-sign-in recovery offline
        shell: powershell
        run: ./eng/Test-LauncherRebootRecovery.ps1 -ZipPath artifacts/Dvinholm-Updater-Banner-Windows-x86.zip -ExpectedTag "ci-${{ github.run_number }}"

      # The external trusted recovery worker records only a bounded outcome
      # and reason code, never install paths or raw error details.
      - name: Verify native Launcher sign-in recovery audit (eight offline checks)
        shell: powershell
        run: ./eng/Test-LauncherRecoveryAudit.ps1 -ZipPath artifacts/Dvinholm-Updater-Banner-Windows-x86.zip -ExpectedTag "ci-${{ github.run_number }}"

      # Eight subprocess tests on the real Windows PowerShell 5.1 host.
      # One dedicated HKCU Run registry entry is scoped to the isolated
      # runner fixture and removed in finally, even when validation fails.
      - name: Verify native Launcher recovery across real Windows processes
        shell: powershell
        run: ./eng/Test-LauncherRecoveryProcesses.ps1 -ZipPath artifacts/Dvinholm-Updater-Banner-Windows-x86.zip -ExpectedTag "ci-${{ github.run_number }}"

      # Explicit post-update backup retirement, no live installation touched.
      - name: Verify native Launcher backup finalization offline
        shell: powershell
        run: ./eng/Test-LauncherBackupFinalization.ps1 -ZipPath artifacts/Dvinholm-Updater-Banner-Windows-x86.zip

      # Eight isolated transaction checks, no real installation modified.
      - name: Verify native launcher offline replacement and recovery
        shell: powershell
        run: ./eng/Test-LauncherReplacement.ps1 -ZipPath artifacts/Dvinholm-Updater-Banner-Windows-x86.zip

      # Re-extract the final standalone ZIP into an isolated directory and
      # execute its own scripts with the inbox Windows PowerShell 5.1 host.
      # No network, WinUI startup, user installation or modal UI.
      - name: Smoke packaged Updater Banner ZIP on Windows
        shell: powershell
        run: |
          ./eng/Test-PackagedUpdaterBanner.ps1 -ZipPath artifacts/Dvinholm-Updater-Banner-Windows-x86.zip

      # Direct + actual worker check against the final signed-by-digest
      # native ZIP. All inspect calls are read-only, and work in temp dirs.
      - name: Verify bundled native Launcher recovery status UI
        shell: powershell
        run: ./eng/Test-PackagedLauncherInspector.ps1 -ZipPath artifacts/Dvinholm-Updater-Banner-Windows-x86.zip -ExpectedTag "ci-${{ github.run_number }}"

      # Upload the exact final ZIP files that were already extracted and
      # SHA-256 verified above. Uploading app/ or app-lite/ instead creates
      # different downloads and wastes CI artifact storage/bandwidth.
      - name: Upload compatibility update feed
        uses: actions/upload-artifact@v7
        with:
          name: Dvinholm-Windows-x86-Lite
          path: artifacts/Dvinholm-Windows-x86-Lite.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload standalone Updater Banner
        uses: actions/upload-artifact@v7
        with:
          name: Dvinholm-Updater-Banner-Windows-x86
          path: artifacts/Dvinholm-Updater-Banner-Windows-x86.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload main Dvinholm distribution
        uses: actions/upload-artifact@v7
        with:
          name: Dvinholm-Windows-x86
          path: artifacts/Dvinholm-Windows-x86.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload Development ZIP checksums
        uses: actions/upload-artifact@v7
        with:
          name: Dvinholm-Distribution-Checksums
          path: artifacts/SHA256SUMS.txt
          if-no-files-found: error

      # Actions artifact ZIP downloads require authentication. Publish the same
      # payload as a public prerelease asset so the installed app can update
      # anonymously, without embedding a personal access token.
      - name: Publish public CI asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "ci-${{ github.run_number }}" "artifacts/Dvinholm-Windows-x86-Lite.zip" "artifacts/SHA256SUMS.txt" "artifacts/Dvinholm-Updater-Banner-Windows-x86.zip" "artifacts/Dvinholm-Windows-x86.zip" --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease --title "Dvinholm CI #${{ github.run_number }}" --notes "Windows x86 Dvinholm with native Launcher and Binaries. Microsoft runtime prerequisites are managed in Launcher. The legacy -Lite ZIP is retained temporarily only for existing updater compatibility."

      # Re-download release assets and validate that GitHub stored the exact
      # three expected files matching our checksums and commit.
      - name: Verify uploaded Development release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $downloadDir = Join-Path $env:RUNNER_TEMP 'dvinholm-published-assets'
          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
          gh release download "ci-${{ github.run_number }}" --repo "${{ github.repository }}" --dir $downloadDir
          if ($LASTEXITCODE -ne 0) { throw 'Failed downloading published CI assets.' }
          $meta = Join-Path $downloadDir 'release.json'
          gh api "repos/${{ github.repository }}/releases/tags/ci-${{ github.run_number }}" | Out-File -LiteralPath $meta -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Failed retrieving published CI metadata.' }
          ./eng/Test-PublishedDevelopmentRelease.ps1 -LiteOnly -WithUpdaterBanner -WithLauncherBundle -ReleaseMetadataFile $meta -Directory $downloadDir -ExpectedTag "ci-${{ github.run_number }}" -ExpectedCommit "${{ github.sha }}"

