name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "AI_WORKLOG.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify .NET SDK
        run: dotnet --version

      # Fail fast if a Windows PowerShell 5.1 packaging or Lite script has a
      # parse error. A malformed preflight must never be masked by negative tests.
      - name: Parse Windows PowerShell 5.1 distribution scripts
        shell: powershell
        run: |
          foreach ($path in @('eng/Test-WindowsDistribution.ps1', 'eng/Test-WindowsDistributionExtraction.ps1', 'eng/Test-LitePrerequisites.ps1', 'eng/Test-LiteBundledPreflight.ps1', 'eng/Test-WindowsDistributionChecksums.ps1', 'eng/Test-PublishedDevelopmentRelease.ps1')) {
            $tokens = $null
            $syntaxErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $path).Path, [ref]$tokens, [ref]$syntaxErrors) | Out-Null
            if (@($syntaxErrors).Count -gt 0) {
              foreach ($syntaxError in $syntaxErrors) {
                Write-Host "::error file=$path,line=$($syntaxError.Extent.StartLineNumber)::$($syntaxError.Message)"
              }
              throw "PowerShell 5.1 syntax failed for $path"
            }
            Write-Host "PowerShell 5.1 syntax valid: $path"
          }

      - name: Restore
        run: dotnet restore Dvinholm.sln

      - name: Build
        run: dotnet build Dvinholm.sln --configuration Release --no-restore -p:Platform=x86

      # The app and its referenced assembly are x86. Install the matching x86
      # .NET SDK so tests run with an x86 test host instead of mixing architectures.
      - name: Setup .NET x86 test host
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
          architecture: x86

      - name: Test
        run: dotnet test tests/Dvinholm.App.Tests/Dvinholm.App.Tests.csproj --configuration Release -p:Platform=x86 --logger "trx;LogFileName=test-results.trx"

      - name: Setup .NET x64 for publish
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          architecture: x64

      # Stage 1: keep fully standalone x86 WinUI, without linker trimming.
      # Do not bundle PDBs in distributed releases; CI test diagnostics remain in TRX.
      - name: Publish Portable
        run: dotnet publish src/Dvinholm.App/Dvinholm.App.csproj --configuration Release --no-restore --self-contained true --runtime win-x86 -p:Platform=x86 -p:WindowsAppSDKSelfContained=true -p:PublishTrimmed=false -p:PublishAot=false -p:DebugType=none -p:DebugSymbols=false -p:Version=0.2.2 -p:InformationalVersion=0.2.2+${{ github.sha }}.ci${{ github.run_number }} --output artifacts/app

      # Stage 2: an optional framework-dependent distribution, not used by
      # the automatic updater. Requires preinstalled .NET x86 and WinAppSDK.
      - name: Publish Lite
        run: dotnet publish src/Dvinholm.App/Dvinholm.App.csproj --configuration Release --no-restore --self-contained false --runtime win-x86 -p:Platform=x86 -p:WindowsAppSDKSelfContained=false -p:PublishTrimmed=false -p:PublishAot=false -p:DebugType=none -p:DebugSymbols=false -p:Version=0.2.2 -p:InformationalVersion=0.2.2+${{ github.sha }}.ci${{ github.run_number }} --output artifacts/app-lite

      - name: Verify branded Windows icon is published
        shell: pwsh
        run: |
          $iconPath = 'artifacts/app/Assets/Dvinholm.ico'
          if (-not (Test-Path -LiteralPath $iconPath -PathType Leaf)) {
            throw "The published Dvinholm app icon is missing: $iconPath"
          }
          if (-not (Test-Path -LiteralPath 'artifacts/app/Dvinholm.App.exe' -PathType Leaf)) {
            throw 'The published Dvinholm executable is missing.'
          }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $iconPath).Path)
          if ($bytes.Length -lt 6) { throw 'Published ICO file is truncated.' }
          $reserved = [System.BitConverter]::ToUInt16($bytes, 0)
          $kind = [System.BitConverter]::ToUInt16($bytes, 2)
          $count = [System.BitConverter]::ToUInt16($bytes, 4)
          if ($reserved -ne 0 -or $kind -ne 1 -or $count -lt 7) {
            throw "Published ICO header is invalid (type $kind, images $count)."
          }
          Write-Host "Verified $count embedded icon sizes and packaged Dvinholm.App.exe."

      - name: Package Portable and Lite (exclude debug tools)
        shell: pwsh
        run: |
          ./eng/Package-WindowsDistribution.ps1 -Flavor Portable -PublishDirectory artifacts/app -ZipPath artifacts/Dvinholm-Windows-x86.zip
          ./eng/Package-WindowsDistribution.ps1 -Flavor Lite -PublishDirectory artifacts/app-lite -ZipPath artifacts/Dvinholm-Windows-x86-Lite.zip
          ./eng/Test-WindowsDistribution.ps1 -Flavor Portable -ZipPath artifacts/Dvinholm-Windows-x86.zip
          ./eng/Test-WindowsDistribution.ps1 -Flavor Lite -ZipPath artifacts/Dvinholm-Windows-x86-Lite.zip
          ./eng/Test-WindowsDistributionExtraction.ps1 -Flavor Portable -ZipPath artifacts/Dvinholm-Windows-x86.zip
          ./eng/Test-WindowsDistributionExtraction.ps1 -Flavor Lite -ZipPath artifacts/Dvinholm-Windows-x86-Lite.zip -SimulatedLiteHost
          ./eng/Test-LiteBundledPreflight.ps1 -Flavor Lite -ZipPath artifacts/Dvinholm-Windows-x86-Lite.zip
          ./eng/Test-LiteBundledPreflight.ps1 -Flavor Portable -ZipPath artifacts/Dvinholm-Windows-x86.zip
          ./eng/Test-WindowsDistributionChecksums.ps1 -Directory artifacts -Generate
          ./eng/Test-WindowsDistributionChecksums.ps1 -Directory artifacts
          $portable = (Get-Item -LiteralPath artifacts/Dvinholm-Windows-x86.zip).Length
          $lite = (Get-Item -LiteralPath artifacts/Dvinholm-Windows-x86-Lite.zip).Length
          if ($lite -ge $portable) { throw "Lite must be smaller than Portable: $lite >= $portable" }
          $report = "| Variant | Compressed bytes | MiB |`n|---|---:|---:|`n"
          $report += "| Portable | $portable | $([math]::Round($portable / 1MB, 2)) |`n"
          $report += "| Lite | $lite | $([math]::Round($lite / 1MB, 2)) |`n"
          $report += "Trimming: **disabled**. Both ZIPs: debugging files excluded.`n"
          $report | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # Upload the exact final ZIP files that were already extracted and
      # SHA-256 verified above. Uploading app/ or app-lite/ instead creates
      # different downloads and wastes CI artifact storage/bandwidth.
      - name: Upload CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: Dvinholm-Windows-x86
          path: artifacts/Dvinholm-Windows-x86.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload Lite artifact
        uses: actions/upload-artifact@v7
        with:
          name: Dvinholm-Windows-x86-Lite
          path: artifacts/Dvinholm-Windows-x86-Lite.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload Development ZIP checksums
        uses: actions/upload-artifact@v7
        with:
          name: Dvinholm-Distribution-Checksums
          path: artifacts/SHA256SUMS.txt
          if-no-files-found: error

      # Actions artifact ZIP downloads require authentication. Publish the same
      # payload as a public prerelease asset so the installed app can update
      # anonymously, without embedding a personal access token.
      - name: Publish public CI asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "ci-${{ github.run_number }}" "artifacts/Dvinholm-Windows-x86.zip" "artifacts/Dvinholm-Windows-x86-Lite.zip" "artifacts/SHA256SUMS.txt" --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease --title "Dvinholm CI #${{ github.run_number }}" --notes "Automated Windows x86 CI build from commit ${{ github.sha }}. Portable is updater-compatible; Lite is an experimental framework-dependent variant requiring x86 runtime prerequisites."

      # Re-download release assets and validate that GitHub stored the exact
      # three expected files matching our checksums and commit.
      - name: Verify uploaded Development release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $downloadDir = Join-Path $env:RUNNER_TEMP 'dvinholm-published-assets'
          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
          gh release download "ci-${{ github.run_number }}" --repo "${{ github.repository }}" --dir $downloadDir
          if ($LASTEXITCODE -ne 0) { throw 'Failed downloading published CI assets.' }
          $meta = Join-Path $downloadDir 'release.json'
          gh api "repos/${{ github.repository }}/releases/tags/ci-${{ github.run_number }}" | Out-File -LiteralPath $meta -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Failed retrieving published CI metadata.' }
          ./eng/Test-PublishedDevelopmentRelease.ps1 -ReleaseMetadataFile $meta -Directory $downloadDir -ExpectedTag "ci-${{ github.run_number }}" -ExpectedCommit "${{ github.sha }}"

  audit-latest-stable-release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve latest stable release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(curl --fail --location --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest)"
          tag="$(jq -r '.tag_name' <<< "$release_json")"
          zip_url="$(jq -r '.assets[] | select(.name == "Dvinholm-Windows-x86.zip") | .browser_download_url' <<< "$release_json")"
          sums_url="$(jq -r '.assets[] | select(.name == "SHA256SUMS.txt") | .browser_download_url' <<< "$release_json")"
          test -n "$tag" && test "$tag" != "null"
          test -n "$zip_url" && test "$zip_url" != "null"
          test -n "$sums_url" && test "$sums_url" != "null"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "zip_url=$zip_url" >> "$GITHUB_OUTPUT"
          echo "sums_url=$sums_url" >> "$GITHUB_OUTPUT"
          echo "Auditing latest stable release: $tag"
      - name: Download latest stable release assets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output Dvinholm-Windows-x86.zip "${{ steps.release.outputs.zip_url }}"
          curl --fail --location --retry 3 --output SHA256SUMS.txt "${{ steps.release.outputs.sums_url }}"
          echo "Release tag: ${{ steps.release.outputs.tag }}"
          echo "Downloaded bytes: $(stat -c '%s' Dvinholm-Windows-x86.zip)"
      - name: Verify published SHA-256
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sed -nE 's/^[[:space:]]*([[:xdigit:]]{64})[[:space:]]+\*?Dvinholm-Windows-x86\.zip[[:space:]]*$/\1/p' SHA256SUMS.txt | head -n 1)"
          actual="$(sha256sum Dvinholm-Windows-x86.zip | awk '{print $1}')"
          test -n "$expected"
          echo "Expected SHA-256: $expected"
          echo "Actual SHA-256:   $actual"
          test "$actual" = "$expected"
      - name: Validate ZIP and inspect packaged files
        shell: bash
        run: |
          set -euo pipefail
          unzip -t Dvinholm-Windows-x86.zip
          echo "## Latest stable release ZIP contents (${{ steps.release.outputs.tag }})" >> "$GITHUB_STEP_SUMMARY"
          unzip -Z1 Dvinholm-Windows-x86.zip | tee archive-files.txt
          echo '~~~text' >> "$GITHUB_STEP_SUMMARY"
          cat archive-files.txt >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          if ! grep -Eiq '(^|/)Dvinholm(\.App)?\.exe$' archive-files.txt; then
            echo "::error::Expected Dvinholm application executable was not found in the release ZIP."
            exit 1
          fi
