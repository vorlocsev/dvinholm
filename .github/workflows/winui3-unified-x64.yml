name: Unified WinUI 3 self-contained Windows x64 pilot

on:
  pull_request:
    paths:
      - 'src/Dvinholm.App/**'
      - 'tests/Dvinholm.App.Tests/**'
      - 'src/Dvinholm.UpdateHandoffProbe/**'
      - 'eng/Test-UnifiedUpdateHandoffProbe.ps1'
      - 'eng/Sign-UnifiedX64Release.ps1'
      - 'eng/Package-UnifiedWinUIX64Pilot.ps1'
      - '.github/workflows/winui3-unified-x64.yml'
      - 'docs/design/DVINHOLM-UNIFIED-WINUI3-X64-APPROVED.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dvinholm-winui3-x64-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Syntax-check the deliberate operator-only signing tool. Never run
      # it in CI, and never inject/create/export a publisher private key here.
      - name: Parse manual x64 signing script (no private key)
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'eng/Sign-UnifiedX64Release.ps1').Path,
            [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw 'Manual x64 signing script syntax invalid.'
          }
          Write-Host 'Manual signing script parses cleanly; signing was not executed.'

      # New pipeline only: DO NOT change the active legacy x86 release feed.
      # Windows App SDK and .NET are packed into the standalone release tree.
      - name: Publish WinUI 3 x64 self-contained application
        shell: pwsh
        run: |
          dotnet publish src/Dvinholm.App/Dvinholm.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:Platform=x64 -p:PlatformTarget=x64 -p:RuntimeIdentifier=win-x64 -p:AssemblyName=Dvinholm -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -p:PublishTrimmed=false -p:PublishAot=false -p:PublishSingleFile=false -p:DebugType=none -p:DebugSymbols=false -p:DvinholmDevelopmentFeatures=false --output artifacts/winui3-unified-x64
          if ($LASTEXITCODE -ne 0) { throw 'WinUI 3 Windows x64 publish failed.' }

      - name: Verify packaged native x64 WinUI 3 runtime and integrity (8 checks)
        shell: pwsh
        run: |
          ./eng/Package-UnifiedWinUIX64Pilot.ps1 -PublishDirectory artifacts/winui3-unified-x64 -ZipPath artifacts/Dvinholm-Windows-x64.zip

      # Exercise the real native x64 managed test host, not only a x64 PE
      # publish. Run ten relevant suites with virtual adapters /
      # synthetic data only. No vendor DLL, vehicle, PIN operation or updater.
      # The development switch is for test fixtures, never for the user ZIP.
      - name: Run CEM and J2534 x64 offline test suites
        shell: pwsh
        run: |
          $filter = @(
            'FullyQualifiedName~CemPartNumberFrameDecoderTests'
            'FullyQualifiedName~CemPartNumberReaderTests'
            'FullyQualifiedName~CemReadOnlyPrerequisiteReportTests'
            'FullyQualifiedName~CemIdentityEvidenceReportTests'
            'FullyQualifiedName~AuroraCemConfigReferenceFilterTests'
            'FullyQualifiedName~J2534PeInspectorTests'
            'FullyQualifiedName~J2534AdapterAuditReportTests'
            'FullyQualifiedName~AuroraApprovedReferenceTests'
            'FullyQualifiedName~CemSafeReleaseWorkspaceTests'
            'FullyQualifiedName~AuroraCemCatalogLocalizationTests'
          ) -join '|'
          dotnet test tests/Dvinholm.App.Tests/Dvinholm.App.Tests.csproj --configuration Release --runtime win-x64 -p:Platform=x64 -p:PlatformTarget=x64 -p:RuntimeIdentifier=win-x64 -p:DvinholmDevelopmentFeatures=true --filter $filter --results-directory artifacts/x64-offline-tests --logger 'trx;LogFileName=x64-cem-j2534.trx'
          if ($LASTEXITCODE -ne 0) { throw 'Windows x64 CEM/J2534 offline tests failed.' }
          $trx = 'artifacts/x64-offline-tests/x64-cem-j2534.trx'
          if (-not (Test-Path -LiteralPath $trx -PathType Leaf)) {
            throw 'Windows x64 test result file was not generated.'
          }
          [xml]$report = Get-Content -LiteralPath $trx -Raw
          $counters = $report.SelectSingleNode("//*[local-name()='Counters']")
          if ($null -eq $counters) { throw 'Windows x64 test counters are missing.' }
          $total = [int]$counters.GetAttribute('total')
          $failed = [int]$counters.GetAttribute('failed')
          if ($total -lt 48 -or $failed -ne 0) {
            throw "Windows x64 coverage below expected floor or failed tests ($total total, $failed failed)."
          }
          "Windows x64 synthetic CEM/J2534 suites: $total tests, $failed failed; physical adapter testing NOT performed." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # Prepare an exact-name candidate pair for later offline verification.
      # This is PR-only; generating a checksum is NOT a release signature.
      - name: Write and verify x64 checksum manifest
        shell: pwsh
        run: |
          $zip = 'artifacts/Dvinholm-Windows-x64.zip'
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw 'x64 ZIP missing.' }
          $digest = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $record = "$digest  Dvinholm-Windows-x64.zip"
          [IO.File]::WriteAllText('artifacts/SHA256SUMS.txt', "$record`n", [Text.Encoding]::ASCII)
          $verified = (Get-Content -LiteralPath 'artifacts/SHA256SUMS.txt' -Raw).TrimEnd()
          if ($verified -cne $record) { throw 'x64 checksum record changed.' }
          Write-Host ('Verified x64 package hash: ' + $digest)

      # Built and tested separately, never copied into the user-facing
      # Dvinholm-Windows-x64.zip or a published release.
      - name: Publish isolated Windows x64 process-exit probe (not shipped)
        shell: pwsh
        run: |
          dotnet publish src/Dvinholm.UpdateHandoffProbe/Dvinholm.UpdateHandoffProbe.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false --output artifacts/fixture-handoff-probe
          if ($LASTEXITCODE -ne 0) { throw 'Fixture handoff probe build failed.' }
          if (-not (Test-Path 'artifacts/fixture-handoff-probe/Dvinholm.UpdateHandoffProbe.exe')) { throw 'Fixture helper EXE missing.' }

      - name: Verify x64 post-exit helper only in marked temporary fixtures (8 checks)
        shell: pwsh
        run: |
          ./eng/Test-UnifiedUpdateHandoffProbe.ps1 -ProbeExe 'artifacts/fixture-handoff-probe/Dvinholm.UpdateHandoffProbe.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Fixture helper checks failed.' }

      - name: Upload unified x64 review artifact (no release)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: Dvinholm-WinUI3-Windows-x64-PR
          path: |
            artifacts/Dvinholm-Windows-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
