name: Experimental Tiny Lite MSIX

on:
  push:
    branches: ["**"]
    paths:
      - "src/Dvinholm.App/**"
      - "eng/New-MsixVisualAssets.ps1"
      - "eng/Test-LiteMsix.ps1"
      - ".github/workflows/lite-msix.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tiny-msix:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Parse build scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($path in @('eng/New-MsixVisualAssets.ps1','eng/Test-LiteMsix.ps1')) {
            $tokens = $null; $errors = $null
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if (@($errors).Count -gt 0) { throw "PowerShell syntax error: $path $errors" }
          }

      - name: Generate branded MSIX images
        shell: powershell
        run: ./eng/New-MsixVisualAssets.ps1

      - name: Build small unsigned framework-dependent MSIX
        shell: powershell
        run: |
          $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $vswhere = Join-Path $programFilesX86 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'MSBuild locator vswhere is missing.' }
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'Visual Studio MSBuild is missing.' }
          $out = Join-Path $pwd 'artifacts\msix'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $appxDir = $out.Replace('\','/') + '/'
          & $msbuild 'src/Dvinholm.App/Dvinholm.App.csproj' '/restore' '/t:Rebuild' '/p:Configuration=Release' '/p:Platform=x86' '/p:RuntimeIdentifier=win-x86' '/p:DvinholmMsix=true' '/p:SelfContained=false' '/p:WindowsAppSDKSelfContained=false' '/p:GenerateAppxPackageOnBuild=true' '/p:AppxBundle=Never' '/p:AppxPackageSigningEnabled=false' '/p:PublishTrimmed=false' '/p:PublishAot=false' '/p:DebugType=none' '/p:DebugSymbols=false' ("/p:AppxPackageDir=" + $appxDir)
          if ($LASTEXITCODE -ne 0) { throw "MSIX packaging failed with $LASTEXITCODE." }

      - name: Validate package and size
        shell: powershell
        run: |
          $packages = @(Get-ChildItem 'artifacts/msix' -Recurse -File -Filter '*.msix' -ErrorAction SilentlyContinue)
          if ($packages.Count -ne 1) { throw "Expected one MSIX under artifacts/msix; found $($packages.Count)." }
          ./eng/Test-LiteMsix.ps1 -PackagePath $packages[0].FullName
          $size = $packages[0].Length
          Write-Host "Tiny framework-dependent MSIX: $size bytes."
          if ($size -ge 20MB) { throw 'MSIX exceeds 20 MiB: check for accidentally bundled runtimes.' }
          New-Item -ItemType Directory -Path artifacts/unsigned-test -Force | Out-Null
          Copy-Item $packages[0].FullName 'artifacts/unsigned-test/Dvinholm-Lite-x86-UNSIGNED.msix'
          "Unsigned framework-dependent MSIX size: $size bytes" | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload test-only unsigned package
        uses: actions/upload-artifact@v7
        with:
          name: Tiny-Lite-MSIX-UNSIGNED-TEST-ONLY
          path: artifacts/unsigned-test/Dvinholm-Lite-x86-UNSIGNED.msix
          if-no-files-found: error
          compression-level: 0
