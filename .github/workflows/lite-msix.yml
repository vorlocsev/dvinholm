name: Experimental Tiny Lite MSIX

# Archived/manual-only validation, not part of active Lite CI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tiny-msix:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Parse build scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($path in @('eng/New-MsixVisualAssets.ps1','eng/Test-LiteMsix.ps1','eng/Test-LiteMsixOfflinePrerequisites.ps1','eng/Test-LiteMsixSimulatedHost.ps1','eng/Test-LiteMsixSigningCertificate.ps1','eng/Test-LiteMsixSdkUnpack.ps1','eng/Test-LiteMsixSha256.ps1','eng/Test-LiteMsixDownloadedArtifact.ps1')) {
            $tokens = $null; $errors = $null
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if (@($errors).Count -gt 0) { throw "PowerShell syntax error: $path $errors" }
          }

      - name: Generate branded MSIX images
        shell: powershell
        run: ./eng/New-MsixVisualAssets.ps1

      - name: Build small unsigned framework-dependent MSIX
        shell: powershell
        run: |
          $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $vswhere = Join-Path $programFilesX86 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'MSBuild locator vswhere is missing.' }
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'Visual Studio MSBuild is missing.' }
          $out = Join-Path $pwd 'artifacts\msix'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $appxDir = $out.Replace('\','/') + '/'
          & $msbuild 'src/Dvinholm.App/Dvinholm.App.csproj' '/restore' '/t:Rebuild' '/p:Configuration=Release' '/p:Platform=x86' '/p:RuntimeIdentifier=win-x86' '/p:DvinholmMsix=true' '/p:DvinholmDevelopmentFeatures=true' '/p:SelfContained=false' '/p:WindowsAppSDKSelfContained=false' '/p:GenerateAppxPackageOnBuild=true' '/p:AppxBundle=Never' '/p:AppxPackageSigningEnabled=false' '/p:PublishTrimmed=false' '/p:PublishAot=false' '/p:DebugType=none' '/p:DebugSymbols=false' ("/p:AppxPackageDir=" + $appxDir)
          if ($LASTEXITCODE -ne 0) { throw "MSIX packaging failed with $LASTEXITCODE." }

      - name: Validate package and size
        shell: powershell
        run: |
          $packages = @(Get-ChildItem 'artifacts/msix' -Recurse -File -Filter 'Dvinholm.App_*_x86.msix' -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch '[\\/]Dependencies[\\/]' })
          if ($packages.Count -ne 1) { throw "Expected one app MSIX (excluding SDK dependency packages); found $($packages.Count)." }
          ./eng/Test-LiteMsix.ps1 -PackagePath $packages[0].FullName
          ./eng/Test-LiteMsixSimulatedHost.ps1 -PackagePath $packages[0].FullName
          ./eng/Test-LiteMsixSdkUnpack.ps1 -PackagePath $packages[0].FullName
          $size = $packages[0].Length
          Write-Host "Tiny framework-dependent MSIX: $size bytes."
          if ($size -ge 20MB) { throw 'MSIX exceeds 20 MiB: check for accidentally bundled runtimes.' }
          New-Item -ItemType Directory -Path artifacts/unsigned-test -Force | Out-Null
          Copy-Item $packages[0].FullName 'artifacts/unsigned-test/Dvinholm-Lite-x86-UNSIGNED.msix'
          $packageCopy = 'artifacts/unsigned-test/Dvinholm-Lite-x86-UNSIGNED.msix'
          $checksum = "$packageCopy.sha256"
          ./eng/Test-LiteMsixSha256.ps1 -PackagePath $packageCopy -ChecksumPath $checksum -Mode Write
          ./eng/Test-LiteMsixSha256.ps1 -PackagePath $packageCopy -ChecksumPath $checksum -Mode Verify
          $actual = (Get-FileHash -LiteralPath $packageCopy -Algorithm SHA256).Hash.ToLowerInvariant()
          "Unsigned MSIX SHA-256 (integrity only): $actual" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "Unsigned framework-dependent MSIX size: $size bytes" | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload test-only unsigned package
        uses: actions/upload-artifact@v7
        with:
          name: Tiny-Lite-MSIX-UNSIGNED-TEST-ONLY
          path: |
            artifacts/unsigned-test/Dvinholm-Lite-x86-UNSIGNED.msix
            artifacts/unsigned-test/Dvinholm-Lite-x86-UNSIGNED.msix.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Download exact unsigned package artifact
        uses: actions/download-artifact@v7
        with:
          name: Tiny-Lite-MSIX-UNSIGNED-TEST-ONLY
          path: artifacts/msix-roundtrip

      - name: Verify downloaded artifact against build and checksum
        shell: powershell
        run: |
          ./eng/Test-LiteMsixDownloadedArtifact.ps1 -ArtifactDirectory 'artifacts/msix-roundtrip' -OriginalPackagePath 'artifacts/unsigned-test/Dvinholm-Lite-x86-UNSIGNED.msix'
          'Unsigned MSIX roundtrip upload/download and sidecar: verified.' | Out-File $env:GITHUB_STEP_SUMMARY -Append
