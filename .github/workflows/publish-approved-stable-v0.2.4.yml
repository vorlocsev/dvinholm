name: Publish verified Dvinholm Stable v0.2.4 draft (owner approved)

on:
  push:
    branches:
      - "release/approved-v0.2.4-a9e6188"
    paths:
      - ".github/workflows/publish-approved-stable-v0.2.4.yml"

# Recovery of the already-created, verified draft, not a second release.
# Release ID and original frozen commit are exact, and main is not modified.
permissions:
  actions: read
  contents: write

concurrency:
  group: dvinholm-stable-v024-exact-publication
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.repository == 'vorlocsev/dvinholm' && github.ref == 'refs/heads/release/approved-v0.2.4-a9e6188' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fail-closed verification of owner-approved draft, assets and provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          frozen='a9e61883a413d4afaebb86fb468987c904250092'
          test "$(gh api repos/vorlocsev/dvinholm/git/ref/heads/main --jq '.object.sha')" = "$frozen" || {
            echo 'main no longer matches frozen Windows-accepted candidate'
            exit 1
          }
          test "$(gh api repos/vorlocsev/dvinholm/actions/runs/40240287577 --jq '.head_sha')" = "$frozen"
          test "$(gh api repos/vorlocsev/dvinholm/actions/runs/40240287577 --jq '.conclusion')" = success
          gh release view v0.2.3 --repo vorlocsev/dvinholm --json tagName >/dev/null
          # A new public tag would be a race; do not overwrite anything.
          if gh api repos/vorlocsev/dvinholm/git/ref/tags/v0.2.4 >/dev/null 2>&1; then
            echo 'v0.2.4 tag already exists; refuse publication/overwrite'
            exit 1
          fi
          gh api repos/vorlocsev/dvinholm/releases/423824316 > draft.json
          python3 - <<'PY'
          import json
          d = json.load(open("draft.json", encoding="utf-8"))
          assert d["id"] == 423824316 and d["draft"] is True and d["prerelease"] is False
          assert d["tag_name"] == "v0.2.4" and d["name"] == "Dvinholm 0.2.4"
          assert d["target_commitish"] == "a9e61883a413d4afaebb86fb468987c904250092"
          assert "frozen and user-accepted" in d["body"]
          expected = {
              "Dvinholm-Windows-x86.zip":
                  (62246431, "sha256:b277dd76211a1dfa1aee214d28fb3ebb15c335ddf8081a381103632533519bfb"),
              "Dvinholm-Windows-x86-Lite.zip":
                  (10362408, "sha256:146372f8b7afcde5ae5eed3ff67957ce6a583b80c40a8f5b2806fb631b5a6f19"),
              "SHA256SUMS.txt":
                  (189, "sha256:402b7290894e904e4a372528f88559a8b4bcd576f8aef6fd6ef2439c13e73d69"),
          }
          found = {asset["name"]: (asset["size"], asset["digest"]) for asset in d["assets"]}
          assert found == expected, "Draft asset bytes or hashes changed; refuse publication"
          print("PASS: exact frozen a9e6188 provenance and three original GitHub SHA-256 draft digests")
          PY

      - name: Publish existing verified draft, then check exact git tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub's get-release-by-tag endpoint intentionally hides drafts.
          # Publish the exact checked draft ID instead of creating duplicates.
          gh api --method PATCH repos/vorlocsev/dvinholm/releases/423824316 \
            -F draft=false \
            -F prerelease=false \
            -F make_latest=true > live.json
          python3 - <<'PY'
          import json
          d = json.load(open("live.json", encoding="utf-8"))
          assert d["id"] == 423824316 and d["tag_name"] == "v0.2.4"
          assert d["draft"] is False and d["prerelease"] is False
          assert d["target_commitish"] == "a9e61883a413d4afaebb86fb468987c904250092"
          assert {a["name"] for a in d["assets"]} == {
              "Dvinholm-Windows-x86.zip",
              "Dvinholm-Windows-x86-Lite.zip",
              "SHA256SUMS.txt",
          }
          print("Release published successfully:", d["html_url"])
          PY
          expected='a9e61883a413d4afaebb86fb468987c904250092'
          tag_sha="$(gh api repos/vorlocsev/dvinholm/git/ref/tags/v0.2.4 --jq '.object.sha')"
          test "$tag_sha" = "$expected" || {
            echo "FATAL: unexpected v0.2.4 tag commit: $tag_sha"
            exit 1
          }
          echo 'Stable v0.2.4 published: frozen a9e6188, original Portable/Lite assets and SHA256SUMS.' >> "$GITHUB_STEP_SUMMARY"
