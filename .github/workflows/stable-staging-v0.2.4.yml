name: Dvinholm Stable 0.2.4 (staging only, no publish)

on:
  pull_request:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/stable-staging-v0.2.4.yml"
      - "eng/Test-ReleaseCandidate024.ps1"
      - "eng/Test-ReleaseCandidate024Lite.ps1"
      - "eng/Test-WindowsDistributionChecksums.ps1"
      - "eng/Test-WindowsDistribution.ps1"
      - "eng/Test-WindowsDistributionExtraction.ps1"
      - "eng/Test-LiteBundledPreflight.ps1"
      - "eng/Test-LitePrerequisites.ps1"
      - "eng/Package-WindowsDistribution.ps1"
      - "src/Dvinholm.App/**"
      - "tests/Dvinholm.Stable.Tests/**"
      - "tests/Dvinholm.App.Tests/StableStaging024ContractTests.cs"
      - "docs/RELEASE_CANDIDATE_0.2.4.md"
  workflow_dispatch:

# A candidate is not a published release. No signing, installation, tags,
# releases, automatic updater changes or access to write GitHub contents.
# Published Stable v0.2.3 remains unchanged.
permissions:
  contents: read

jobs:
  stage-two-flavors:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate main or PR commit
        uses: actions/checkout@v7

      - name: Setup .NET x64 for restore
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Parse Windows PowerShell 5.1 candidate and checksum verifiers
        shell: powershell
        run: |
          foreach ($script in @('eng/Test-ReleaseCandidate024.ps1',
              'eng/Test-ReleaseCandidate024Lite.ps1',
              'eng/Test-WindowsDistributionChecksums.ps1')) {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $script).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if (@($errors).Count -gt 0) { throw "PowerShell 5.1 syntax failure in $script" }
          }

      - name: Restore application solution
        run: dotnet restore Dvinholm.sln

      - name: Setup .NET x86 test host
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
          architecture: x86

      - name: Test actual production-only assembly (eight offline smoke gates)
        run: dotnet test tests/Dvinholm.Stable.Tests/Dvinholm.Stable.Tests.csproj --configuration Release -p:Platform=x86 -p:DvinholmDevelopmentFeatures=false --logger "trx;LogFileName=stable024-two-flavors.trx"

      - name: Restore .NET x64 publish host
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          architecture: x64

      - name: Publish production-only Portable and Lite from same exact commit
        shell: pwsh
        run: |
          dotnet publish src/Dvinholm.App/Dvinholm.App.csproj --configuration Release --no-restore --runtime win-x86 --self-contained true -p:Platform=x86 -p:WindowsAppSDKSelfContained=true -p:PublishTrimmed=false -p:PublishAot=false -p:DvinholmDevelopmentFeatures=false -p:DebugType=none -p:DebugSymbols=false -p:Version=0.2.4 -p:InformationalVersion=0.2.4+${{ github.sha }}.stable -p:IncludeSourceRevisionInInformationalVersion=false --output artifacts/stable024-app-portable
          if ($LASTEXITCODE -ne 0) { throw 'Portable 0.2.4 staging publish failed.' }
          dotnet publish src/Dvinholm.App/Dvinholm.App.csproj --configuration Release --no-restore --runtime win-x86 --self-contained false -p:Platform=x86 -p:WindowsAppSDKSelfContained=false -p:PublishTrimmed=false -p:PublishAot=false -p:DvinholmDevelopmentFeatures=false -p:DebugType=none -p:DebugSymbols=false -p:Version=0.2.4 -p:InformationalVersion=0.2.4+${{ github.sha }}.stable -p:IncludeSourceRevisionInInformationalVersion=false --output artifacts/stable024-app-lite
          if ($LASTEXITCODE -ne 0) { throw 'Lite 0.2.4 staging publish failed.' }

      - name: Package and run eight gates separately on both ZIPs
        shell: powershell
        run: |
          $portable = 'artifacts/stable024-single-portable'
          $lite = 'artifacts/stable024-single-lite'
          New-Item -ItemType Directory -Path $portable -Force | Out-Null
          New-Item -ItemType Directory -Path $lite -Force | Out-Null
          ./eng/Package-WindowsDistribution.ps1 -Flavor Portable -PublishDirectory 'artifacts/stable024-app-portable' -ZipPath "$portable/Dvinholm-Windows-x86.zip"
          ./eng/Package-WindowsDistribution.ps1 -Flavor Lite -PublishDirectory 'artifacts/stable024-app-lite' -ZipPath "$lite/Dvinholm-Windows-x86-Lite.zip"
          ./eng/Test-ReleaseCandidate024.ps1 -ArchiveDirectory $portable -ExpectedCommit '${{ github.sha }}' -Channel stable -GenerateChecksum
          ./eng/Test-ReleaseCandidate024Lite.ps1 -ArchiveDirectory $lite -ExpectedCommit '${{ github.sha }}' -Channel stable -GenerateChecksum
          $portableSize = (Get-Item -LiteralPath "$portable/Dvinholm-Windows-x86.zip").Length
          $liteSize = (Get-Item -LiteralPath "$lite/Dvinholm-Windows-x86-Lite.zip").Length
          if ($liteSize -ge $portableSize) { throw 'Stable staging Lite must be smaller than Portable.' }
          ./eng/Test-ReleaseCandidate024.ps1 -ArchiveDirectory $portable -ExpectedCommit '${{ github.sha }}' -Channel stable
          ./eng/Test-ReleaseCandidate024Lite.ps1 -ArchiveDirectory $lite -ExpectedCommit '${{ github.sha }}' -Channel stable

      - name: Combine strict two-variant checksum manifest without changing ZIP bytes
        shell: powershell
        run: |
          $combined = 'artifacts/stable024-combined'
          New-Item -ItemType Directory -Path $combined -Force | Out-Null
          Copy-Item -LiteralPath 'artifacts/stable024-single-portable/Dvinholm-Windows-x86.zip' -Destination $combined
          Copy-Item -LiteralPath 'artifacts/stable024-single-lite/Dvinholm-Windows-x86-Lite.zip' -Destination $combined
          ./eng/Test-WindowsDistributionChecksums.ps1 -Directory $combined -Generate
          ./eng/Test-WindowsDistributionChecksums.ps1 -Directory $combined
          $lines = [IO.File]::ReadAllLines((Join-Path (Resolve-Path $combined).Path 'SHA256SUMS.txt'))
          if ($lines.Count -ne 2 -or
              $lines[0] -cnotmatch '^[0-9a-f]{64}  Dvinholm-Windows-x86[.]zip$' -or
              $lines[1] -cnotmatch '^[0-9a-f]{64}  Dvinholm-Windows-x86-Lite[.]zip$') {
            throw 'Combined Stable 0.2.4 manifest must have two lowercase entries in canonical order.'
          }
          $singlePortable = ([IO.File]::ReadAllLines((Resolve-Path 'artifacts/stable024-single-portable/SHA256SUMS.txt').Path))[0]
          $singleLite = ([IO.File]::ReadAllLines((Resolve-Path 'artifacts/stable024-single-lite/SHA256SUMS.txt').Path))[0]
          if ($lines[0] -cne $singlePortable -or $lines[1] -cne $singleLite) {
            throw 'Combined checksums differ from independently audited variant manifests.'
          }

      - name: Upload unsigned 0.2.4 Stable staging only (NOT PUBLISHED)
        uses: actions/upload-artifact@v7
        with:
          name: Dvinholm-v0.2.4-STAGED-NOT-PUBLISHED
          path: |
            artifacts/stable024-combined/Dvinholm-Windows-x86.zip
            artifacts/stable024-combined/Dvinholm-Windows-x86-Lite.zip
            artifacts/stable024-combined/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

      - name: Download actual combined staging artifact
        uses: actions/download-artifact@v7
        with:
          name: Dvinholm-v0.2.4-STAGED-NOT-PUBLISHED
          path: artifacts/stable024-downloaded

      - name: Reverify downloaded pair without regenerating any ZIP hash
        shell: powershell
        run: |
          $download = (Resolve-Path -LiteralPath 'artifacts/stable024-downloaded').Path
          $files = @(Get-ChildItem -LiteralPath $download -Force)
          $expectedFiles = @('Dvinholm-Windows-x86.zip', 'Dvinholm-Windows-x86-Lite.zip', 'SHA256SUMS.txt')
          if ($files.Count -ne 3 -or @($files | Where-Object {
              $_.PSIsContainer -or $expectedFiles -cnotcontains $_.Name
          }).Count -gt 0) { throw 'Downloaded Stable 0.2.4 artifact file set is not the expected three flat files.' }
          ./eng/Test-WindowsDistributionChecksums.ps1 -Directory $download
          $manifest = Join-Path $download 'SHA256SUMS.txt'
          $lines = [IO.File]::ReadAllLines($manifest)
          if ($lines.Count -ne 2 -or
              $lines[0] -cnotmatch '^[0-9a-f]{64}  Dvinholm-Windows-x86[.]zip$' -or
              $lines[1] -cnotmatch '^[0-9a-f]{64}  Dvinholm-Windows-x86-Lite[.]zip$') {
            throw 'Downloaded manifest is not strict, ordered lowercase SHA-256.'
          }
          $portable = Join-Path $env:RUNNER_TEMP ('dvinholm-stable024-portable-' + [Guid]::NewGuid().ToString('N'))
          $lite = Join-Path $env:RUNNER_TEMP ('dvinholm-stable024-lite-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $portable, $lite -Force | Out-Null
          try {
            Copy-Item -LiteralPath (Join-Path $download 'Dvinholm-Windows-x86.zip') -Destination $portable
            Copy-Item -LiteralPath (Join-Path $download 'Dvinholm-Windows-x86-Lite.zip') -Destination $lite
            # Subset the ORIGINAL downloaded checksum lines. Do not recalculate
            # a digest and accidentally bless changed bytes.
            [IO.File]::WriteAllText((Join-Path $portable 'SHA256SUMS.txt'),
                $lines[0] + [Environment]::NewLine, [Text.Encoding]::ASCII)
            [IO.File]::WriteAllText((Join-Path $lite 'SHA256SUMS.txt'),
                $lines[1] + [Environment]::NewLine, [Text.Encoding]::ASCII)
            ./eng/Test-ReleaseCandidate024.ps1 -ArchiveDirectory $portable -ExpectedCommit '${{ github.sha }}' -Channel stable
            ./eng/Test-ReleaseCandidate024Lite.ps1 -ArchiveDirectory $lite -ExpectedCommit '${{ github.sha }}' -Channel stable
            Write-Host 'Both downloaded Stable 0.2.4 ZIPs passed all eight exact-SHA checks. NOT PUBLISHED.'
            'Dvinholm 0.2.4: Portable + Lite ZIP, canonical SHA256SUMS and product SHA verified. Staging only; NOT PUBLISHED. GUI and physical J2534 untested.' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          } finally {
            if (Test-Path -LiteralPath $portable) { Remove-Item -LiteralPath $portable -Recurse -Force }
            if (Test-Path -LiteralPath $lite) { Remove-Item -LiteralPath $lite -Recurse -Force }
          }
