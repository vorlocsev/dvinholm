name: Dvinholm Stable 0.2.4 (staging only, no publish)

# Archived/manual-only validation, not part of active Lite CI.
# No signing, installation, release creation or physical hardware verification.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-two-flavors:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate main or PR commit
        uses: actions/checkout@v7

      - name: Setup .NET x64 for restore
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Parse Windows PowerShell 5.1 candidate and checksum verifiers
        shell: powershell
        run: |
          foreach ($script in @('eng/Test-ReleaseCandidate024.ps1',
              'eng/Test-ReleaseCandidate024Lite.ps1',
              'eng/Test-WindowsDistributionChecksums.ps1',
              'eng/Prepare-StableAcceptance024.ps1',
              'eng/Start-StableAcceptance024.ps1',
              'eng/Write-StableReadiness024.ps1',
              'eng/Test-RealStableUpgrade024.ps1')) {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $script).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if (@($errors).Count -gt 0) {
              foreach ($problem in $errors) {
                Write-Host ("::error file={0},line={1}::{2}" -f $script,
                  $problem.Extent.StartLineNumber, $problem.Message)
              }
              throw "PowerShell 5.1 syntax failure in $script"
            }
          }

      - name: Restore application solution
        run: dotnet restore Dvinholm.sln

      - name: Setup .NET x86 test host
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
          architecture: x86

      - name: Test actual production-only assembly (eight offline smoke gates)
        run: dotnet test tests/Dvinholm.Stable.Tests/Dvinholm.Stable.Tests.csproj --configuration Release -p:Platform=x86 -p:DvinholmDevelopmentFeatures=false --logger "trx;LogFileName=stable024-two-flavors.trx"

      - name: Restore .NET x64 publish host
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          architecture: x64

      - name: Publish production-only Portable and Lite from same exact commit
        shell: pwsh
        run: |
          dotnet publish src/Dvinholm.App/Dvinholm.App.csproj --configuration Release --no-restore --runtime win-x86 --self-contained true -p:Platform=x86 -p:WindowsAppSDKSelfContained=true -p:PublishTrimmed=false -p:PublishAot=false -p:DvinholmDevelopmentFeatures=false -p:DebugType=none -p:DebugSymbols=false -p:Version=0.2.4 -p:InformationalVersion=0.2.4+${{ github.sha }}.stable -p:IncludeSourceRevisionInInformationalVersion=false --output artifacts/stable024-app-portable
          if ($LASTEXITCODE -ne 0) { throw 'Portable 0.2.4 staging publish failed.' }
          dotnet publish src/Dvinholm.App/Dvinholm.App.csproj --configuration Release --no-restore --runtime win-x86 --self-contained false -p:Platform=x86 -p:WindowsAppSDKSelfContained=false -p:PublishTrimmed=false -p:PublishAot=false -p:DvinholmDevelopmentFeatures=false -p:DebugType=none -p:DebugSymbols=false -p:Version=0.2.4 -p:InformationalVersion=0.2.4+${{ github.sha }}.stable -p:IncludeSourceRevisionInInformationalVersion=false --output artifacts/stable024-app-lite
          if ($LASTEXITCODE -ne 0) { throw 'Lite 0.2.4 staging publish failed.' }

      - name: Package and run eight gates separately on both ZIPs
        shell: powershell
        run: |
          $portable = 'artifacts/stable024-single-portable'
          $lite = 'artifacts/stable024-single-lite'
          New-Item -ItemType Directory -Path $portable -Force | Out-Null
          New-Item -ItemType Directory -Path $lite -Force | Out-Null
          ./eng/Package-WindowsDistribution.ps1 -Flavor Portable -PublishDirectory 'artifacts/stable024-app-portable' -ZipPath "$portable/Dvinholm-Windows-x86.zip"
          ./eng/Package-WindowsDistribution.ps1 -Flavor Lite -PublishDirectory 'artifacts/stable024-app-lite' -ZipPath "$lite/Dvinholm-Windows-x86-Lite.zip"
          ./eng/Test-ReleaseCandidate024.ps1 -ArchiveDirectory $portable -ExpectedCommit '${{ github.sha }}' -Channel stable -GenerateChecksum
          ./eng/Test-ReleaseCandidate024Lite.ps1 -ArchiveDirectory $lite -ExpectedCommit '${{ github.sha }}' -Channel stable -GenerateChecksum
          $portableSize = (Get-Item -LiteralPath "$portable/Dvinholm-Windows-x86.zip").Length
          $liteSize = (Get-Item -LiteralPath "$lite/Dvinholm-Windows-x86-Lite.zip").Length
          if ($liteSize -ge $portableSize) { throw 'Stable staging Lite must be smaller than Portable.' }
          ./eng/Test-ReleaseCandidate024.ps1 -ArchiveDirectory $portable -ExpectedCommit '${{ github.sha }}' -Channel stable
          ./eng/Test-ReleaseCandidate024Lite.ps1 -ArchiveDirectory $lite -ExpectedCommit '${{ github.sha }}' -Channel stable

      - name: Combine strict two-variant checksum manifest without changing ZIP bytes
        shell: powershell
        run: |
          $combined = 'artifacts/stable024-combined'
          New-Item -ItemType Directory -Path $combined -Force | Out-Null
          Copy-Item -LiteralPath 'artifacts/stable024-single-portable/Dvinholm-Windows-x86.zip' -Destination $combined
          Copy-Item -LiteralPath 'artifacts/stable024-single-lite/Dvinholm-Windows-x86-Lite.zip' -Destination $combined
          ./eng/Test-WindowsDistributionChecksums.ps1 -Directory $combined -Generate
          ./eng/Test-WindowsDistributionChecksums.ps1 -Directory $combined
          $lines = [IO.File]::ReadAllLines((Join-Path (Resolve-Path $combined).Path 'SHA256SUMS.txt'))
          if ($lines.Count -ne 2 -or
              $lines[0] -cnotmatch '^[0-9a-f]{64}  Dvinholm-Windows-x86[.]zip$' -or
              $lines[1] -cnotmatch '^[0-9a-f]{64}  Dvinholm-Windows-x86-Lite[.]zip$') {
            throw 'Combined Stable 0.2.4 manifest must have two lowercase entries in canonical order.'
          }
          $singlePortable = ([IO.File]::ReadAllLines((Resolve-Path 'artifacts/stable024-single-portable/SHA256SUMS.txt').Path))[0]
          $singleLite = ([IO.File]::ReadAllLines((Resolve-Path 'artifacts/stable024-single-lite/SHA256SUMS.txt').Path))[0]
          if ($lines[0] -cne $singlePortable -or $lines[1] -cne $singleLite) {
            throw 'Combined checksums differ from independently audited variant manifests.'
          }

      - name: Upload unsigned 0.2.4 Stable staging only (NOT PUBLISHED)
        uses: actions/upload-artifact@v7
        with:
          name: Dvinholm-v0.2.4-STAGED-NOT-PUBLISHED
          path: |
            artifacts/stable024-combined/Dvinholm-Windows-x86.zip
            artifacts/stable024-combined/Dvinholm-Windows-x86-Lite.zip
            artifacts/stable024-combined/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

      - name: Download actual combined staging artifact
        uses: actions/download-artifact@v7
        with:
          name: Dvinholm-v0.2.4-STAGED-NOT-PUBLISHED
          path: artifacts/stable024-downloaded

      - name: Reverify downloaded pair without regenerating any ZIP hash
        shell: powershell
        run: |
          $download = (Resolve-Path -LiteralPath 'artifacts/stable024-downloaded').Path
          $files = @(Get-ChildItem -LiteralPath $download -Force)
          $expectedFiles = @('Dvinholm-Windows-x86.zip', 'Dvinholm-Windows-x86-Lite.zip', 'SHA256SUMS.txt')
          if ($files.Count -ne 3 -or @($files | Where-Object {
              $_.PSIsContainer -or $expectedFiles -cnotcontains $_.Name
          }).Count -gt 0) { throw 'Downloaded Stable 0.2.4 artifact file set is not the expected three flat files.' }
          ./eng/Test-WindowsDistributionChecksums.ps1 -Directory $download
          $manifest = Join-Path $download 'SHA256SUMS.txt'
          $lines = [IO.File]::ReadAllLines($manifest)
          if ($lines.Count -ne 2 -or
              $lines[0] -cnotmatch '^[0-9a-f]{64}  Dvinholm-Windows-x86[.]zip$' -or
              $lines[1] -cnotmatch '^[0-9a-f]{64}  Dvinholm-Windows-x86-Lite[.]zip$') {
            throw 'Downloaded manifest is not strict, ordered lowercase SHA-256.'
          }
          $portable = Join-Path $env:RUNNER_TEMP ('dvinholm-stable024-portable-' + [Guid]::NewGuid().ToString('N'))
          $lite = Join-Path $env:RUNNER_TEMP ('dvinholm-stable024-lite-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $portable, $lite -Force | Out-Null
          try {
            Copy-Item -LiteralPath (Join-Path $download 'Dvinholm-Windows-x86.zip') -Destination $portable
            Copy-Item -LiteralPath (Join-Path $download 'Dvinholm-Windows-x86-Lite.zip') -Destination $lite
            # Subset the ORIGINAL downloaded checksum lines. Do not recalculate
            # a digest and accidentally bless changed bytes.
            [IO.File]::WriteAllText((Join-Path $portable 'SHA256SUMS.txt'),
                $lines[0] + [Environment]::NewLine, [Text.Encoding]::ASCII)
            [IO.File]::WriteAllText((Join-Path $lite 'SHA256SUMS.txt'),
                $lines[1] + [Environment]::NewLine, [Text.Encoding]::ASCII)
            ./eng/Test-ReleaseCandidate024.ps1 -ArchiveDirectory $portable -ExpectedCommit '${{ github.sha }}' -Channel stable
            ./eng/Test-ReleaseCandidate024Lite.ps1 -ArchiveDirectory $lite -ExpectedCommit '${{ github.sha }}' -Channel stable
            Write-Host 'Both downloaded Stable 0.2.4 ZIPs passed all eight exact-SHA checks. NOT PUBLISHED.'
            'Dvinholm 0.2.4: Portable + Lite ZIP, canonical SHA256SUMS and product SHA verified. Staging only; NOT PUBLISHED. GUI and physical J2534 untested.' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          } finally {
            if (Test-Path -LiteralPath $portable) { Remove-Item -LiteralPath $portable -Recurse -Force }
            if (Test-Path -LiteralPath $lite) { Remove-Item -LiteralPath $lite -Recurse -Force }
          }

      - name: Download real published Stable v0.2.3 for isolated upgrade rehearsal
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $json = gh api "repos/${{ github.repository }}/releases/tags/v0.2.3"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to inspect published Stable 0.2.3.' }
          $release = $json | ConvertFrom-Json
          if ($release.draft -or $release.prerelease -or
              $release.tag_name -cne 'v0.2.3' -or
              $release.target_commitish -cne '91ecc343608c931eb033523e3db6012a6c5dbd58') {
            throw 'Published Stable 0.2.3 metadata does not match immutable original release.'
          }
          $names = @($release.assets | ForEach-Object { $_.name } | Sort-Object)
          if ($names.Count -ne 2 -or
              $names[0] -cne 'Dvinholm-Windows-x86.zip' -or
              $names[1] -cne 'SHA256SUMS.txt') {
            throw 'Published Stable 0.2.3 must have exactly original ZIP and checksum assets.'
          }
          New-Item -ItemType Directory -Path 'artifacts/published-stable-v023' -Force | Out-Null
          gh release download v0.2.3 --repo '${{ github.repository }}' --dir 'artifacts/published-stable-v023' --pattern 'Dvinholm-Windows-x86.zip' --pattern 'SHA256SUMS.txt'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download official published Stable 0.2.3 ZIP and SHA manifest.' }

      - name: Eight real Stable 0.2.3 to staged 0.2.4 file-upgrade and rollback gates (no GUI)
        shell: powershell
        run: |
          ./eng/Test-RealStableUpgrade024.ps1 -PreviousArchiveDirectory 'artifacts/published-stable-v023' -CandidateArchiveDirectory 'artifacts/stable024-downloaded' -ExpectedCommit '${{ github.sha }}'
          'Eight read-only published 0.2.3 to staged 0.2.4 file mirror/rollback gates passed; private settings preserved. NOT A GUI UPDATER TEST; NOT PUBLISHED.' | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - name: Rehearse exact-SHA isolated Stable 0.2.4 acceptance on downloaded ZIPs (no GUI)
        shell: powershell
        run: |
          $dest = Join-Path $env:RUNNER_TEMP ('Dvinholm-stable024-acceptance-' + [Guid]::NewGuid().ToString('N'))
          try {
            ./eng/Prepare-StableAcceptance024.ps1 -ArchiveDirectory 'artifacts/stable024-downloaded' -ExpectedCommit '${{ github.sha }}' -DestinationDirectory $dest
            foreach ($name in @('Dvinholm.App.exe', 'ACCEPTANCE-0.2.4.txt')) {
              if (-not (Test-Path -LiteralPath (Join-Path $dest $name) -PathType Leaf)) {
                throw "Stable acceptance extracted ZIP missing $name."
              }
            }
            if (-not (Test-Path -LiteralPath (Join-Path $dest 'acceptance-user-data') -PathType Container)) {
              throw 'Stable acceptance user-data isolation was not prepared.'
            }
            try {
              ./eng/Prepare-StableAcceptance024.ps1 -ArchiveDirectory 'artifacts/stable024-downloaded' -ExpectedCommit '${{ github.sha }}' -DestinationDirectory $dest
              throw 'Stable acceptance repeated preparation illegally overwrote its destination.'
            } catch {
              if ($_.Exception.Message -notlike '*destination already exists*') { throw }
            }
            Write-Host 'Stable 0.2.4 human acceptance preparation passed; repeated attempt rejected. WinUI NOT launched.'
          } finally {
            if (Test-Path -LiteralPath $dest) { Remove-Item -LiteralPath $dest -Recurse -Force }
          }

      - name: Record exact Stable 0.2.4 commit for read-only acceptance kit
        shell: powershell
        run: |
          [IO.File]::WriteAllText((Join-Path (Get-Location).Path 'BUILD_COMMIT_024_STABLE.txt'),
            '${{ github.sha }}' + [Environment]::NewLine, [Text.Encoding]::ASCII)

      - name: One-click Stable 0.2.4 acceptance against downloaded ZIPs (no GUI)
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP ('Dvinholm-stable024-oneclick-' + [Guid]::NewGuid().ToString('N'))
          $kit = Join-Path $root 'kit'
          $candidate = Join-Path $root 'candidate'
          New-Item -ItemType Directory -Path $kit -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $kit 'eng') -Force | Out-Null
          New-Item -ItemType Directory -Path $candidate -Force | Out-Null
          try {
            Copy-Item -LiteralPath 'START-STABLE-ACCEPTANCE-024.cmd' -Destination $kit
            Copy-Item -LiteralPath 'BUILD_COMMIT_024_STABLE.txt' -Destination $kit
            foreach ($name in @('Start-StableAcceptance024.ps1',
                'Prepare-StableAcceptance024.ps1', 'Test-ReleaseCandidate024.ps1',
                'Test-ReleaseCandidate024Lite.ps1', 'Test-WindowsDistribution.ps1',
                'Test-WindowsDistributionExtraction.ps1',
                'Test-WindowsDistributionChecksums.ps1',
                'Test-LiteBundledPreflight.ps1', 'Test-LitePrerequisites.ps1',
                'Check-Lite-Prerequisites.cmd')) {
              Copy-Item -LiteralPath (Join-Path 'eng' $name) -Destination (Join-Path $kit 'eng')
            }
            # The Lite simulated-host audit derives the SDK line from the
            # exact checked-out project; mirror that source in the stand-alone
            # kit rather than silently skipping a critical validation gate.
            $sourceProject = 'src/Dvinholm.App/Dvinholm.App.csproj'
            $kitProjectDirectory = Join-Path $kit 'src/Dvinholm.App'
            New-Item -ItemType Directory -Path $kitProjectDirectory -Force | Out-Null
            Copy-Item -LiteralPath $sourceProject -Destination $kitProjectDirectory
            foreach ($name in @('Dvinholm-Windows-x86.zip',
                'Dvinholm-Windows-x86-Lite.zip', 'SHA256SUMS.txt')) {
              Copy-Item -LiteralPath (Join-Path 'artifacts/stable024-downloaded' $name) -Destination $candidate
            }
            $provenance = Join-Path $kit 'BUILD_COMMIT_024_STABLE.txt'
            $correct = [IO.File]::ReadAllText($provenance, [Text.Encoding]::ASCII)
            # First prove a tampered receipt fails BEFORE extraction.
            [IO.File]::WriteAllText($provenance, 'INVALID" & echo injected', [Text.Encoding]::ASCII)
            Push-Location $kit
            try {
              & cmd.exe /d /c 'START-STABLE-ACCEPTANCE-024.cmd --prepare-only'
              $invalidStatus = $LASTEXITCODE
              $global:LASTEXITCODE = 0
              if ($invalidStatus -eq 0) { throw 'Tampered SHA receipt was incorrectly accepted.' }
            } finally { Pop-Location }
            $output = Join-Path $root 'Dvinholm-024-stable-acceptance'
            if (Test-Path -LiteralPath $output) {
              throw 'Malformed SHA created an acceptance destination.'
            }
            [IO.File]::WriteAllText($provenance, $correct, [Text.Encoding]::ASCII)
            Push-Location $kit
            try {
              & cmd.exe /d /c 'START-STABLE-ACCEPTANCE-024.cmd --prepare-only'
              $validStatus = $LASTEXITCODE
              $global:LASTEXITCODE = 0
              if ($validStatus -ne 0) { throw 'One-click exact-SHA preparation failed.' }
            } finally { Pop-Location }
            foreach ($name in @('ACCEPTANCE-0.2.4.txt', 'Dvinholm.App.exe')) {
              if (-not (Test-Path -LiteralPath (Join-Path $output $name) -PathType Leaf)) {
                throw "One-click acceptance missing $name."
              }
            }
            if (-not (Test-Path -LiteralPath (Join-Path $output 'acceptance-user-data') -PathType Container)) {
              throw 'One-click acceptance private settings directory missing.'
            }
            Push-Location $kit
            try {
              & cmd.exe /d /c 'START-STABLE-ACCEPTANCE-024.cmd --prepare-only'
              $repeatStatus = $LASTEXITCODE
              $global:LASTEXITCODE = 0
              if ($repeatStatus -eq 0) { throw 'Second one-click preparation overwrote an existing target.' }
            } finally { Pop-Location }
            Write-Host 'One-click Stable 0.2.4 acceptance: malformed SHA refused, valid downloaded pair verified, repeat refused, NO GUI launched.'
          } finally {
            $global:LASTEXITCODE = 0
            if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          }

      - name: Generate fail-closed Stable 0.2.4 pre-release HOLD evidence (never a release)
        shell: powershell
        run: |
          ./eng/Write-StableReadiness024.ps1 -ArchiveDirectory 'artifacts/stable024-downloaded' -ExpectedCommit '${{ github.sha }}' -ReportPath 'READINESS-0.2.4.md'
          $report = [IO.File]::ReadAllText((Resolve-Path 'READINESS-0.2.4.md').Path)
          if ($report -notmatch 'Release decision: HOLD' -or
              $report -notmatch 'NO GO for publication' -or
              $report -notmatch '${{ github.sha }}') {
            throw 'Readiness evidence omitted exact commit or release HOLD.'
          }
          $humanSection = ($report -split '## Mandatory human Windows 11 LTSC checks \(NOT DONE BY CI\)')[1]
          if ($null -eq $humanSection) { throw 'Missing explicit human-only section.' }
          $humanSection = ($humanSection -split '## Remaining release blockers')[0]
          if (@([regex]::Matches($humanSection, '(?m)^- \[ \] ')).Count -ne 8) {
            throw 'Exactly eight human Windows GUI checks must remain unchecked.'
          }
          # This evidence file is separate from its verification scripts and
          # never changes a GitHub Release, tag or installed user's files.
          Write-Host 'Stable 0.2.4 readiness: HOLD, eight manual GUI checks pending. No release.'

      - name: Upload Stable 0.2.4 human Windows acceptance kit (NOT PUBLISHED)
        uses: actions/upload-artifact@v7
        with:
          name: Dvinholm-v0.2.4-STABLE-WINDOWS-ACCEPTANCE-KIT
          path: |
            BUILD_COMMIT_024_STABLE.txt
            READINESS-0.2.4.md
            START-STABLE-ACCEPTANCE-024.cmd
            eng/Start-StableAcceptance024.ps1
            eng/Prepare-StableAcceptance024.ps1
            eng/Test-ReleaseCandidate024.ps1
            eng/Test-ReleaseCandidate024Lite.ps1
            eng/Test-WindowsDistribution.ps1
            eng/Test-WindowsDistributionExtraction.ps1
            eng/Test-WindowsDistributionChecksums.ps1
            eng/Test-LiteBundledPreflight.ps1
            eng/Test-LitePrerequisites.ps1
            eng/Check-Lite-Prerequisites.cmd
            src/Dvinholm.App/Dvinholm.App.csproj
            docs/RELEASE_CANDIDATE_0.2.4.md
            docs/UPDATE_MENU_WINDOWS_ACCEPTANCE.md
          if-no-files-found: error

      - name: Assemble and verify single-download update-menu acceptance bundle (NO GUI)
        shell: powershell
        run: |
          $root = 'artifacts/update-menu-acceptance-bundle'
          $candidate = Join-Path $root 'candidate'
          $kit = Join-Path $root 'kit'
          foreach ($dir in @($candidate, (Join-Path $kit 'eng'),
              (Join-Path $kit 'src/Dvinholm.App'), (Join-Path $kit 'docs'))) {
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
          }
          foreach ($name in @('Dvinholm-Windows-x86.zip',
              'Dvinholm-Windows-x86-Lite.zip', 'SHA256SUMS.txt')) {
            # Copy the original already-download-verified files as-is.
            Copy-Item -LiteralPath (Join-Path 'artifacts/stable024-downloaded' $name) -Destination $candidate -ErrorAction Stop
          }
          foreach ($name in @('BUILD_COMMIT_024_STABLE.txt',
              'READINESS-0.2.4.md', 'START-STABLE-ACCEPTANCE-024.cmd')) {
            Copy-Item -LiteralPath $name -Destination $kit -ErrorAction Stop
          }
          foreach ($name in @('Start-StableAcceptance024.ps1',
              'Prepare-StableAcceptance024.ps1', 'Test-ReleaseCandidate024.ps1',
              'Test-ReleaseCandidate024Lite.ps1', 'Test-WindowsDistribution.ps1',
              'Test-WindowsDistributionExtraction.ps1', 'Test-WindowsDistributionChecksums.ps1',
              'Test-LiteBundledPreflight.ps1', 'Test-LitePrerequisites.ps1',
              'Check-Lite-Prerequisites.cmd')) {
            Copy-Item -LiteralPath (Join-Path 'eng' $name) -Destination (Join-Path $kit 'eng') -ErrorAction Stop
          }
          Copy-Item -LiteralPath 'src/Dvinholm.App/Dvinholm.App.csproj' -Destination (Join-Path $kit 'src/Dvinholm.App') -ErrorAction Stop
          foreach ($name in @('RELEASE_CANDIDATE_0.2.4.md', 'UPDATE_MENU_WINDOWS_ACCEPTANCE.md')) {
            Copy-Item -LiteralPath (Join-Path 'docs' $name) -Destination (Join-Path $kit 'docs') -ErrorAction Stop
          }
          Copy-Item -LiteralPath 'START-UPDATE-MENU-ACCEPTANCE.cmd' -Destination $root -ErrorAction Stop
          $rawReceipt = [IO.File]::ReadAllText((Resolve-Path -LiteralPath (Join-Path $kit 'BUILD_COMMIT_024_STABLE.txt')).Path)
          if ($rawReceipt -cnotmatch '\A[0-9a-f]{40}(\r?\n)?\z' -or
              $rawReceipt.Substring(0, 40) -cne '${{ github.sha }}') {
            throw 'Single-download acceptance receipt does not match exact workflow SHA.'
          }
          ./eng/Test-WindowsDistributionChecksums.ps1 -Directory $candidate
          if (-not $?) { throw 'Single-download bundle original SHA256SUMS verification failed.' }
          $destination = Join-Path $root 'Dvinholm-024-stable-acceptance'
          try {
            & cmd.exe /d /c 'artifacts\update-menu-acceptance-bundle\START-UPDATE-MENU-ACCEPTANCE.cmd --prepare-only'
            if ($LASTEXITCODE -ne 0) { throw 'Single-download acceptance wrapper verification failed.' }
            if (-not (Test-Path -LiteralPath (Join-Path $destination 'ACCEPTANCE-0.2.4.txt') -PathType Leaf)) {
              throw 'Single-download prepare-only did not create verified acceptance receipt.'
            }
            if (-not (Test-Path -LiteralPath (Join-Path $destination 'acceptance-user-data') -PathType Container)) {
              throw 'Single-download prepare-only did not create private user-data folder.'
            }
          }
          finally {
            if (Test-Path -LiteralPath $destination) {
              Remove-Item -LiteralPath $destination -Recurse -Force
            }
            $global:LASTEXITCODE = 0
          }
          Write-Host 'Single-download bundle verified: SHA256, matching commit, private extraction, no GUI, no release.'

      - name: Upload update-menu Windows one-download acceptance bundle (NOT PUBLISHED)
        uses: actions/upload-artifact@v7
        with:
          name: Dvinholm-UPDATE-MENU-WINDOWS-ONE-DOWNLOAD
          path: artifacts/update-menu-acceptance-bundle/
          if-no-files-found: error
          compression-level: 0
