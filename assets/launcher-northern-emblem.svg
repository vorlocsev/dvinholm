<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
<title id="title">Dvinholm Launcher: Techno-North No. 9</title>
<desc id="desc">Approved Techno-North design number 9: a riveted industrial silver gear and ring, a detailed white gull in flight, layered steel White Sea waves and a strong diagonal arrow passing through the ring. No separate update badge.</desc>
