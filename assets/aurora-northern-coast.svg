<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="260" viewBox="0 0 1600 260">
  <!-- Decorative, static Aurora scene: never a vehicle-identification or J2534 status display. -->
  <!-- Built from vector shapes so the brand-free artwork can be scaled on high-DPI displays. -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#031326"/>
      <stop offset=".32" stop-color="#082240"/>
      <stop offset=".68" stop-color="#17385B"/>
      <stop offset="1" stop-color="#102648"/>
    </linearGradient>
    <linearGradient id="upperSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06162D" stop-opacity=".72"/>
      <stop offset=".66" stop-color="#1A3359" stop-opacity=".08"/>
      <stop offset="1" stop-color="#2BA8B5" stop-opacity=".27"/>
    </linearGradient>
    <linearGradient id="auroraGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#23D6B7" stop-opacity="0"/>
      <stop offset=".23" stop-color="#40E4A8" stop-opacity=".23"/>
      <stop offset=".55" stop-color="#78FFE0" stop-opacity=".7"/>
      <stop offset=".76" stop-color="#26F4CC" stop-opacity=".72"/>
      <stop offset="1" stop-color="#55F1C8" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="auroraViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#455BD7" stop-opacity="0"/>
      <stop offset=".44" stop-color="#776EE2" stop-opacity=".17"/>
      <stop offset=".72" stop-color="#CB8CF7" stop-opacity=".64"/>
      <stop offset="1" stop-color="#3FA5E4" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12536E"/>
      <stop offset=".26" stop-color="#0B3B61"/>
      <stop offset="1" stop-color="#04172B"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#436A86"/>
      <stop offset=".25" stop-color="#25445D"/>
      <stop offset=".72" stop-color="#102C46"/>
      <stop offset="1" stop-color="#061B30"/>
    </linearGradient>
    <linearGradient id="frost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74B9CE" stop-opacity=".50"/>
      <stop offset="1" stop-color="#0D3451" stop-opacity=".25"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="260" fill="url(#night)"/>
  <rect width="1600" height="220" fill="url(#upperSky)"/>
  <!-- Flowing northern light curtains, deliberately above and right of page headings. -->
  <path d="M320,-20 C518,37 696,-21 852,30 C1049,103 1133,-8 1307,20 C1431,47 1506,7 1650,-11"
        fill="none" stroke="url(#auroraGreen)" stroke-width="91" opacity=".31"/>
  <path d="M384,-8 C580,67 684,18 831,61 C1029,115 1182,1 1318,40 C1444,70 1551,31 1635,8"
        fill="none" stroke="url(#auroraGreen)" stroke-width="38" opacity=".50"/>
  <path d="M683,-22 C821,58 921,-2 1057,31 C1212,72 1371,-6 1537,26 C1592,36 1620,40 1650,42"
        fill="none" stroke="url(#auroraViolet)" stroke-width="57" opacity=".39"/>
  <path d="M516,12 C773,-4 947,71 1113,21 C1283,-31 1459,46 1625,18"
        fill="none" stroke="#78F7C9" stroke-width="9" opacity=".38"/>
  <path d="M697,64 C837,85 947,99 1052,67 C1225,17 1384,66 1588,59"
        fill="none" stroke="#51B8E8" stroke-width="8" opacity=".27"/>
  <!-- Scattered stars visible in the calm sky. -->
  <g fill="#D4EBFC">
    <circle cx="468" cy="44" r="1.3" opacity=".56"/><circle cx="559" cy="21" r=".9" opacity=".68"/>
    <circle cx="632" cy="75" r="1.1" opacity=".39"/><circle cx="741" cy="15" r="1.1" opacity=".55"/>
    <circle cx="902" cy="22" r="1" opacity=".72"/><circle cx="983" cy="8" r=".8" opacity=".45"/>
    <circle cx="1092" cy="54" r="1.2" opacity=".6"/><circle cx="1181" cy="16" r=".85" opacity=".68"/>
    <circle cx="1342" cy="85" r="1.1" opacity=".5"/><circle cx="1417" cy="18" r="1.05" opacity=".5"/>
    <circle cx="1538" cy="80" r=".8" opacity=".59"/><circle cx="366" cy="110" r="1" opacity=".48"/>
  </g>
  <!-- Distant White Sea shoreline, dark hills and a narrow illuminated horizon. -->
  <path d="M0,183 C201,176 370,186 517,177 C630,169 716,156 807,161 C933,169 999,150 1099,153 C1287,162 1399,153 1600,151 L1600,260 L0,260 Z"
        fill="#071B34"/>
  <path d="M0,187 C235,182 410,185 620,175 C847,161 1037,168 1180,161 C1387,158 1480,162 1600,158"
        fill="none" stroke="#3E8FA7" stroke-width="3" opacity=".37"/>
  <path d="M0,186 H1600 V260 H0 Z" fill="url(#sea)" opacity=".82"/>
  <path d="M601,197 C768,190 859,203 990,189 C1174,178 1318,191 1565,183"
        fill="none" stroke="#3DE6C9" stroke-width="3" opacity=".28"/>
  <path d="M507,217 C700,209 846,219 1006,205 C1245,188 1432,208 1584,194"
        fill="none" stroke="#3CB3D0" stroke-width="4" opacity=".18"/>
  <path d="M831,233 C1042,218 1181,227 1442,212" fill="none" stroke="#6DDFDD" stroke-width="2" opacity=".20"/>
  <path d="M0,237 C161,230 329,246 509,232 C689,217 793,236 939,231 C1126,220 1348,238 1600,217 V260 H0 Z"
        fill="#06182C" opacity=".76"/>
  <!-- Coastline boulders below the decorative vehicle. -->
  <path d="M951,244 L1051,222 L1135,232 L1210,213 L1300,221 L1381,209 L1493,229 L1574,218 L1600,230 V260 H951 Z"
        fill="#07182B"/>
  <path d="M1074,228 L1128,222 L1180,226 M1275,222 L1324,215 L1370,219 M1450,232 L1511,226"
        stroke="url(#frost)" stroke-width="4" fill="none" opacity=".55"/>
  <!-- Static, unlabelled Nordic SUV silhouette: illustration, not a discovered ECU/vehicle. -->
  <g transform="translate(1138 119)">
    <path d="M5,93 L23,64 L76,49 L108,17 Q123,8 144,8 L240,9 Q257,10 266,24 L298,56 L326,70 L334,98 L324,111 L17,111 L4,102 Z"
          fill="url(#carBody)" stroke="#8AC8DC" stroke-width="2.7"/>
    <path d="M82,50 L115,20 L230,21 Q241,21 249,32 L276,57 L83,57 Z"
          fill="#0A1B2F" stroke="#7DB8D6" stroke-width="2"/>
    <path d="M151,20 L151,57 M84,63 H278 M174,65 V102 M91,103 H282"
          stroke="#5F8EAA" stroke-width="2" fill="none" opacity=".80"/>
    <path d="M14,76 L38,70 L43,82 L10,86 Z" fill="#BDEFFE" opacity=".9"/>
    <path d="M305,71 L326,77 L330,87 L309,85 Z" fill="#B86F84" opacity=".85"/>
    <path d="M29,87 L296,87" stroke="#23D3E7" stroke-width="2.6" opacity=".6"/>
    <circle cx="81" cy="109" r="30" fill="#071A2B" stroke="#5EA2C1" stroke-width="6"/>
    <circle cx="268" cy="109" r="30" fill="#071A2B" stroke="#5EA2C1" stroke-width="6"/>
    <circle cx="81" cy="109" r="9" fill="#6BA4BD" stroke="#BDDCEB" stroke-width="3"/>
    <circle cx="268" cy="109" r="9" fill="#6BA4BD" stroke="#BDDCEB" stroke-width="3"/>
    <path d="M22,62 C68,61 84,53 102,41" stroke="#7DBDCF" stroke-width="1.7" fill="none" opacity=".67"/>
  </g>
  <!-- A small edge of Arctic forest frames the far-right horizon. -->
  <g fill="#03182A" opacity=".90">
    <path d="M1543,187 L1543,80 M1510,187 L1510,121 M1590,187 L1590,103" stroke="#041628" stroke-width="6"/>
    <path d="M1543,77 L1515,132 L1525,132 L1503,160 L1519,160 L1499,186 L1586,186 L1567,161 L1581,161 L1560,132 L1570,132 Z"/>
    <path d="M1510,119 L1493,154 L1501,154 L1483,179 L1537,179 L1522,154 L1530,154 Z"/>
    <path d="M1590,101 L1572,148 L1582,148 L1566,183 L1600,183 L1600,150 Z"/>
  </g>
</svg>
